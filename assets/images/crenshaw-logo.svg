    <path d="M38 0 C62 0 74 6 76 16 C76 52 58 68 38 78 C18 68 0 52 0 16 C2 6 14 0 38 0 Z" fill="url(#crenshawGold)" />
    <!-- White Oak Tree Silhouette -->
    <path d="M38 18 C33 18 29 22 28 26 C24 27 21 31 22 35 C19 37 18 41 20 44 C20 47 23 50 26 51 C27 52 29 52 31 51 C32 54 35 56 38 56 C41 56 44 54 45 51 C47 52 49 52 50 51 C53 50 56 47 56 44 C58 41 57 37 54 35 C55 31 52 27 48 26 C47 22 43 18 38 18 Z" fill="#FFFFFF" opacity="0.95"/>
    <!-- Tree Trunk -->
    <path d="M36 48 L35 66 C35 67 31 68 28 69 L48 69 C45 68 41 67 41 66 L40 48 Z" fill="#FFFFFF" opacity="0.95"/>
  </g>

  <!-- Typography -->
  <g transform="translate(98, 16)">
    <!-- CRENSHAW ACADEMY -->
    <text x="0" y="32" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="3.5" fill="#1C1836">CRENSHAW ACADEMY</text>
    <!-- Subtitle: ROOTED IN EDUCATION SINCE 1997 -->
    <text x="2" y="52" font-family="'Inter', -apple-system, sans-serif" font-size="9.5" font-weight="700" letter-spacing="2.8" fill="#7C8798">ROOTED IN EDUCATION SINCE 1997 · ORLANDO, FL</text>
  </g>
</svg>
