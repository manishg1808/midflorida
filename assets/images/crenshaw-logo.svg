<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 88" width="520" height="88">
  <defs>
    <linearGradient id="crenshawGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5B25D" />
      <stop offset="50%" stop-color="#C99238" />
      <stop offset="100%" stop-color="#A8731E" />
    </linearGradient>
    <filter id="shieldShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Golden Shield Emblem with Oak Tree Motif -->
  <g transform="translate(6, 6)" filter="url(#shieldShadow)">
