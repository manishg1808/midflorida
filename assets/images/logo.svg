<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 88" width="460" height="88">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcedaa" />
      <stop offset="45%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#a67c1e" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#182c4f" />
      <stop offset="100%" stop-color="#0b172a" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Crest Shield -->
  <g transform="translate(10, 4)">
    <!-- Outer Shield Border -->
    <path d="M40 0 C64 0 76 6 80 14 C80 50 62 68 40 80 C18 68 0 50 0 14 C4 6 16 0 40 0 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="3" filter="url(#goldGlow)"/>
    <!-- Inner Shield Inset -->
    <path d="M40 6 C60 6 70 11 74 18 C74 47 58 62 40 73 C22 62 6 47 6 18 C10 11 20 6 40 6 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.85"/>
    
    <!-- Stylized Oak Tree & Torch of Scholarship -->
    <path d="M37 62 C37 46 32 40 26 36 C34 37 38 41 39 46 L41 46 C42 41 46 37 54 36 C48 40 43 46 43 62 C46 64 52 66 56 68 C50 66 43 65 40 65 C37 65 30 66 24 68 C28 66 34 64 37 62 Z" fill="url(#goldGrad)"/>
    <circle cx="40" cy="22" r="7.5" fill="url(#goldGrad)" opacity="0.95"/>
    <circle cx="28" cy="26" r="6" fill="url(#goldGrad)" opacity="0.95"/>
    <circle cx="52" cy="26" r="6" fill="url(#goldGrad)" opacity="0.95"/>
    <circle cx="21" cy="33" r="5" fill="url(#goldGrad)" opacity="0.95"/>
    <circle cx="59" cy="33" r="5" fill="url(#goldGrad)" opacity="0.95"/>
    <circle cx="33" cy="32" r="5.5" fill="url(#goldGrad)" opacity="0.95"/>
    <circle cx="47" cy="32" r="5.5" fill="url(#goldGrad)" opacity="0.95"/>
    <circle cx="40" cy="35" r="4.5" fill="url(#goldGrad)" opacity="0.9"/>
    <path d="M38 13 C40 10 40 10 42 13 C43 15 41 17 40 17 C39 17 37 15 38 13 Z" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- Typography -->
  <g transform="translate(108, 12)">
    <!-- MID FLORIDA -->
    <text x="0" y="32" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="28" font-weight="700" letter-spacing="3" fill="#0b172a">MID FLORIDA</text>
    <!-- SCHOLARS ACADEMY -->
    <text x="0" y="58" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="23" font-weight="700" letter-spacing="3" fill="#d4af37">SCHOLARS ACADEMY</text>
    <!-- Subtitle -->
    <text x="2" y="73" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="8.5" font-weight="700" letter-spacing="2.8" fill="#50617a" text-transform="uppercase">PRIVATE K-12 · COLLEGE PREPARATORY · ORLANDO, FL</text>
  </g>
</svg>
