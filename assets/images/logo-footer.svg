<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 220" width="280" height="220">
  <defs>
    <linearGradient id="footGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcedaa" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#b08815" />
    </linearGradient>
    <filter id="footGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g transform="translate(85, 8)">
    <!-- Outer Shield -->
    <path d="M55 0 C88 0 105 8 110 20 C110 70 85 96 55 112 C25 96 0 70 0 20 C5 8 22 0 55 0 Z" fill="#ffffff" filter="url(#footGlow)"/>
    <!-- Inner Shield Inset -->
    <path d="M55 6 C84 6 98 13 103 23 C103 66 80 89 55 103 C30 89 7 66 7 23 C12 13 26 6 55 6 Z" fill="#0b172a"/>
    
    <!-- Gold Oak & Scholarship Emblem -->
    <path d="M51 86 C51 64 44 56 36 50 C47 52 52 58 53 64 L57 64 C58 58 63 52 74 50 C66 56 59 64 59 86 C63 89 71 91 77 94 C69 91 59 90 55 90 C51 90 41 91 33 94 C39 91 47 89 51 86 Z" fill="url(#footGold)"/>
    <circle cx="55" cy="30" r="10" fill="url(#footGold)"/>
    <circle cx="38" cy="36" r="8.5" fill="url(#footGold)"/>
    <circle cx="72" cy="36" r="8.5" fill="url(#footGold)"/>
    <circle cx="28" cy="46" r="7" fill="url(#footGold)"/>
    <circle cx="82" cy="46" r="7" fill="url(#footGold)"/>
    <circle cx="45" cy="45" r="7.5" fill="url(#footGold)"/>
    <circle cx="65" cy="45" r="7.5" fill="url(#footGold)"/>
    <circle cx="55" cy="50" r="6" fill="url(#footGold)"/>
  </g>

  <!-- Typography -->
  <g text-anchor="middle">
    <text x="140" y="148" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="24" font-weight="700" letter-spacing="3" fill="#ffffff">MID FLORIDA</text>
    <text x="140" y="174" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="20" font-weight="700" letter-spacing="2.5" fill="#d4af37">SCHOLARS ACADEMY</text>
    <text x="140" y="194" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="9" font-weight="600" letter-spacing="3" fill="#e8d9a0">PRIVATE K-12 · ORLANDO, FL</text>
  </g>
